<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "nav.html" %}
    <h1>🏆 Leaderboard</h1>

    {% if consumers %}
    <table>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Points</th>
        </tr>
        {% for c in consumers %}
        <tr>
            <td>{{ loop.index }}</td>
            <td><a class="plain" href="/rewards/{{ c.consumer_id }}">{{ c.name }}</a></td>
            <td>{{ c.points_balance }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No consumers yet</p>
    {% endif %}
</body>
</html>
